server:
  port: ${SERVER_PORT:3002}

spring:
  application:
    name: echo-community
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:echo_community}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
  quartz:
    job-store-type: memory
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/init.sql
        - classpath:sql/security.sql

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.echo.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
